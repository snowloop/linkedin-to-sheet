<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linkedin to Sheet</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main>
    <h1>Linkedin to Sheet</h1>
    <p id="status" class="status"></p>

    <form id="capture-form">
      <label>
        Name
        <input name="name" type="text" required />
      </label>
      <label>
        Website URL
        <input name="websiteUrl" type="url" />
      </label>
      <label>
        LinkedIn URL
        <input name="linkedinUrl" type="url" />
      </label>


      <label>
        Industry
        <input name="industry" type="text" />
      </label>
      <label>
        Company size
        <input name="companySize" type="text" />
      </label>


      <label>
        Location
        <input name="location" type="text" />
      </label>
      <label>
        Notes
        <textarea name="notes" rows="3"></textarea>
      </label>

      <button type="submit" id="save-btn">Save to Sheet</button>
      <p id="save-feedback" class="status save-feedback" role="status" aria-live="polite"></p>
    </form>

    <button type="button" id="rescan-btn" class="secondary">Re-scan current page</button>

    <footer>
      <a href="#" id="open-options">Options</a>
    </footer>
  </main>
  <script type="module" src="./main.ts"></script>
</body>

</html>
