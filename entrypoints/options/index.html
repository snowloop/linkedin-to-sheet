<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linkedin to Sheet — Options</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Linkedin to Sheet — Settings</h1>

      <section>
        <h2>1. Google account</h2>
        <p class="hint">
          Connect the Google account that owns the spreadsheet below.
        </p>

        <p id="connection-status" class="status"></p>
        <div class="button-row">
          <button type="button" id="connect-btn">Connect Google account</button>
          <button type="button" id="disconnect-btn" class="secondary">Disconnect</button>
        </div>
      </section>

      <form id="settings-form">
        <h2>2. Google Sheet</h2>
        <label>
          Spreadsheet ID
          <input name="spreadsheetId" type="text" placeholder="From the sheet's URL" />
        </label>
        <label>
          Sheet / tab name
          <input name="sheetName" type="text" placeholder="Sheet1" />
        </label>

        <button type="submit" id="save-settings-btn">Save settings</button>
      </form>

      <p id="save-feedback" class="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
